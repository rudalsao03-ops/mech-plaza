<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e111a">
<link rel="icon" type="image/png" href="../icon-192.png">
<title>럭키슬랩 쿠지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root{--bg:#0e111a;--card:#171b28;--card2:#1f2435;--bd:#323a54;--text:#f3edda;--sub:#9aa0b8;--gold:#d9a030;--gold2:#ffe08a;--ink:#14161f;
    --S:#e2453c;--A:#d9a030;--B:#3a7cf0;--C:#6f7690;--LAST:#9a5cd6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .px{font-family:"Galmuri11",sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}
  button{font:inherit;color:inherit;cursor:pointer}
  .demo{background:#3a2a10;color:var(--gold2);text-align:center;font:12px "Galmuri11",sans-serif;padding:7px 10px;border-bottom:1px solid #6b4f12}
  header{position:sticky;top:0;z-index:5;background:rgba(14,17,26,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
  header .wrap{display:flex;align-items:center;gap:10px;height:56px}
  .logo{font:bold 19px "Galmuri11",sans-serif;flex:1;color:var(--text);text-decoration:none}
  .logo i{font-style:normal;color:var(--gold2)}
  .pill{font:bold 12px "Galmuri11",sans-serif;border:1px solid var(--bd);border-radius:99px;padding:6px 11px;background:var(--card);color:var(--text);text-decoration:none}

  h2{font:bold 19px "Galmuri11",sans-serif;margin:24px 0 4px}
  .lead{color:var(--sub);font-size:13px;margin:0 0 12px}

  /* 판 목록 */
  .bcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:0;margin-bottom:14px;overflow:hidden}
  .bcard .art{height:150px;position:relative;background:radial-gradient(120% 90% at 50% 0%,#2b3150 0%,#151826 70%);display:flex;align-items:flex-end;justify-content:center;gap:0;padding-bottom:12px}
  .mini{width:62px;height:90px;border-radius:7px;background:#f2ead6;border:2px solid #04050a;padding:4px;margin:0 -6px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
  .mini b{display:block;height:11px;border-radius:3px;font:bold 7px/11px "Galmuri11",sans-serif;color:#fff;text-align:center}
  .mini span{display:block;height:65px;margin-top:4px;border-radius:4px;background:linear-gradient(135deg,#ff9a5c,#ffd760 30%,#7be0a8 55%,#6aa8ff 78%,#c58bff);background-size:220% 220%;animation:holo 5s ease-in-out infinite alternate}
  @keyframes holo{to{background-position:100% 100%}}
  .bcard .badge{position:absolute;left:12px;top:12px;font:bold 11px "Galmuri11",sans-serif;background:var(--S);color:#fff;border-radius:7px;padding:4px 8px}
  .bcard .badge.live{background:#b8322c}
  .bcard .body{padding:14px 16px 16px}
  .bcard h3{margin:0 0 6px;font:bold 16px/1.35 "Galmuri11",sans-serif}
  .row2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .price{font:bold 20px "Galmuri11",sans-serif;color:var(--gold2)}
  .price small{font-size:12px;color:var(--sub);font-weight:normal;margin-left:3px}
  .bar{height:9px;border-radius:99px;background:#252b3e;overflow:hidden;margin:10px 0 5px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--S))}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
  .meta b{color:var(--text)}

  /* 판 상세 */
  .back{background:none;border:0;color:var(--sub);padding:14px 0 0;font-size:13px}
  .hero{background:radial-gradient(120% 100% at 50% 0%,#2b3150 0%,#171b28 75%);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-top:10px}
  .hero h1{font:bold 21px/1.3 "Galmuri11",sans-serif;margin:0 0 8px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .stats div{background:rgba(0,0,0,.25);border-radius:12px;padding:9px 6px;text-align:center}
  .stats b{display:block;font:bold 17px "Galmuri11",sans-serif;color:var(--gold2)}
  .stats small{font-size:11px;color:var(--sub)}
  .tier{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px}
  .tier .th{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .g{flex:none;min-width:30px;height:24px;padding:0 6px;border-radius:7px;color:#fff;font:bold 12px/24px "Galmuri11",sans-serif;text-align:center}
  .tier .th b{flex:1;font-size:14px}
  .tier .th span{font-size:12px;color:var(--sub)}
  .item{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:4px 0}
  .item.gone{color:#59607a;text-decoration:line-through}
  .item{align-items:center}
  .item .nm{display:flex;align-items:center;gap:9px;min-width:0}
  .item img{width:40px;height:56px;object-fit:cover;object-position:top;border-radius:5px;flex:none;border:1px solid var(--bd)}
  .item.gone img{opacity:.3;filter:grayscale(1)}
  .tk .b img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:8px}
  .tk .b .g{position:relative;z-index:1}
  .tk .b.ph{justify-content:flex-end;padding-bottom:8px}
  .tk .b.ph small{position:relative;z-index:1;background:rgba(10,12,20,.82);border-radius:6px;padding:2px 4px}
  .tk.big{width:104px;height:150px}
  .item .q{color:var(--sub);white-space:nowrap}
  .fair{background:var(--card);border:1px dashed var(--bd);border-radius:16px;padding:12px 14px;font-size:12.5px;color:var(--sub);line-height:1.6}
  .fair code{display:block;word-break:break-all;color:var(--gold2);font:11px/1.5 ui-monospace,Menlo,monospace;background:#0b0d14;border-radius:8px;padding:8px;margin:6px 0}
  .log{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:6px 14px}
  .log div{display:flex;gap:8px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid #232839}
  .log div:last-child{border-bottom:0}
  .log .n{color:var(--sub);font-size:12px;width:62px;flex:none}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:14px}

  /* 하단 구매바 */
  .buy{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(14,17,26,.96);border-top:1px solid var(--bd);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
  .buy .wrap{display:flex;gap:8px}
  .qty{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;flex:none}
  .qty button{border:0;background:none;padding:0 13px;font:bold 13px "Galmuri11",sans-serif;color:var(--sub)}
  .qty button.on{background:var(--card2);color:var(--gold2)}
  .go{flex:1;border:0;border-radius:14px;background:linear-gradient(180deg,#ffe08a,#d9a030);color:var(--ink);font:bold 15px "Galmuri11",sans-serif;padding:14px 10px;box-shadow:0 4px 0 #8a5a12}
  .go:disabled{background:#2a3048;color:#6d7390;box-shadow:none}

  /* 결과 연출 */
  .ov{position:fixed;inset:0;z-index:10;background:rgba(5,7,12,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .ov h3{font:bold 18px "Galmuri11",sans-serif;margin:0 0 4px}
  .ov p{color:var(--sub);font-size:13px;margin:0 0 16px}
  .grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:460px}
  .tk{width:84px;height:120px;perspective:600px}
  .tk .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.3,1.2);transform-style:preserve-3d}
  .tk.open .in{transform:rotateY(180deg)}
  .tk .f,.tk .b{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
  .tk .f{background:repeating-linear-gradient(45deg,#2a2f45,#2a2f45 8px,#232838 8px,#232838 16px);border:2px solid var(--gold);font:bold 26px "Galmuri11",sans-serif;color:var(--gold2)}
  .tk .b{transform:rotateY(180deg);background:var(--card2);border:2px solid var(--bd)}
  .tk .b .g{margin-bottom:6px}
  .tk .b small{font-size:10.5px;line-height:1.3;color:var(--text)}
  .tk.hit .b{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(255,224,138,.25),0 0 28px rgba(255,200,90,.55);background:radial-gradient(circle at 50% 30%,#4a3a14,#1f2435 70%)}
  .tk.wait .in{animation:wob .5s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .ov .act{display:flex;gap:8px;margin-top:20px;width:100%;max-width:340px}
  .ov .act button{flex:1;border:0;border-radius:14px;padding:13px;font:bold 14px "Galmuri11",sans-serif}
  .ov .act .p{background:var(--gold2);color:var(--ink)}
  .ov .act .s{background:var(--card2);color:var(--text)}
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:11}
  .hidden{display:none!important}
  body.embed header{display:none}
  body.embed{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  @media (prefers-reduced-motion:reduce){.mini span{animation:none}.tk .in{transition:none}.tk.wait .in{animation:none}}
  .demo.live{background:#12321f;color:#9ff0bf;border-bottom-color:#1f6b3a}
  .who{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--sub)}
  .who input,.codebox input{flex:1;min-width:0;background:#0b0d14;border:1px solid var(--bd);border-radius:10px;color:var(--text);font:14px "Galmuri11",sans-serif;padding:9px 10px;outline:0}
  .who input:focus,.codebox input:focus{border-color:var(--gold)}
  .codebox{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:13px;color:var(--sub)}
  .codebox .r{display:flex;gap:8px;margin-top:8px}
  .codebox button{border:0;border-radius:10px;background:var(--card2);color:var(--gold2);font:bold 13px "Galmuri11",sans-serif;padding:0 14px}
  .codebox b{color:var(--gold2)}
  .tag{display:inline-block;font:bold 11px "Galmuri11",sans-serif;border-radius:7px;padding:3px 8px;margin:0 0 8px;background:#2a3048;color:var(--sub)}
  .tag.test{background:#3a2a10;color:var(--gold2)}.tag.live{background:#4a1d1d;color:#ff9a9a}.tag.end{background:#2a2e3d;color:#9aa0b8}
  .bcard .art img{width:62px;height:90px;object-fit:cover;object-position:top;border-radius:7px;border:2px solid #04050a;margin:0 -6px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
  .toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:12;background:linear-gradient(90deg,#b8322c,#d9a030);color:#fff;font:bold 13px "Galmuri11",sans-serif;padding:10px 14px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:calc(100% - 24px);text-align:center}
  .buylink{flex:1;display:block;text-align:center;text-decoration:none;border-radius:14px;background:linear-gradient(180deg,#ffe08a,#d9a030);color:var(--ink);font:bold 15px "Galmuri11",sans-serif;padding:14px 10px;box-shadow:0 4px 0 #8a5a12}
  .orders{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:6px 14px;margin-top:8px}
  .orders a{display:flex;justify-content:space-between;color:var(--text);text-decoration:none;font-size:13px;padding:9px 0;border-bottom:1px solid #232839}
  .orders a:last-child{border-bottom:0}.orders a span{color:var(--gold2)}
  .wait{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px 18px;margin-top:18px;text-align:center}
  .wait h3{font:bold 18px "Galmuri11",sans-serif;margin:0 0 8px}.wait p{color:var(--sub);font-size:13.5px;margin:0 0 14px}
  .err{background:#4a1d1d;color:#ffb3b3;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="demo" id="modeBar">연결 확인 중…</div>
<header><div class="wrap">
  <a class="logo" href="#">🍀 LUCKY<i>SLAB</i></a>
  <a class="pill" href="../">🌙 광장</a>
  <a class="pill" id="shopLink" href="../shop/">상점</a>
</div></header>

<main class="wrap" id="view"></main>
<div class="buy hidden" id="buy"><div class="wrap">
  <div class="qty" id="qty"><button data-n="1" class="on">1회</button><button data-n="5">5회</button><button data-n="10">10회</button></div>
  <button class="go" id="go">뽑기</button>
  <a class="buylink hidden" id="buyLink" target="_blank" rel="noopener">결제하고 바로 뽑기 →</a>
</div></div>

<div class="ov hidden" id="ov">
  <h3 id="ovT">두근두근…</h3>
  <p id="ovS">카드를 눌러서 열어보세요</p>
  <div class="grid" id="ovG"></div>
  <div class="act hidden" id="ovA"><button class="s" id="ovAll">전부 열기</button><button class="p" id="ovOk">확인</button></div>
</div>
<div class="toast hidden" id="toast"></div>
<canvas id="fx"></canvas>

<script src="../data.js"></script>
<script>
(() => {
'use strict';
const D = window.LUCKY || {}, $ = s => document.querySelector(s);
const QS = new URLSearchParams(location.search);
const EMBED = QS.has('embed') && window.parent !== window;
if (EMBED) document.body.classList.add('embed');
const tellPlaza = msg => { if (EMBED) try { window.parent.postMessage(msg, location.origin); } catch (e) {} };
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const won = n => (+n || 0).toLocaleString('ko-KR') + '원';
const COL = g => `var(--${['S', 'A', 'B', 'C', 'LAST'].includes(g) ? g : 'C'})`;
const HIT = g => g === 'S' || g === 'A' || g === 'B' || g === 'LAST';
const GN = g => g === 'LAST' ? '라스트' : g + '상';
const imgUrl = u => !u ? '' : /^https?:/.test(u) ? u : '../' + u;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const sha256 = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(x => x.toString(16).padStart(2, '0')).join('');
if (D.SHOP_URL) $('#shopLink').href = D.SHOP_URL;
let myName = (store.get('luckyslab-me', null) || {}).name || store.get('luckyslab-kuji-name', '') || '';

/* =====================================================================
   API: 서버(Supabase)가 있으면 서버, 없으면 이 브라우저 안에서 흉내 내는 데모
   ===================================================================== */
const Server = {
  sb: null,
  async init() {
    if (QS.has('demo') || !D.SUPABASE_URL || !D.SUPABASE_ANON_KEY) return false;
    try {
      await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      this.sb = window.supabase.createClient(D.SUPABASE_URL, D.SUPABASE_ANON_KEY);
      const { error } = await this.sb.rpc('kuji_list');
      if (error) { console.warn('kuji server not ready', error.message); return false; }
      return true;
    } catch (e) { console.warn(e); return false; }
  },
  async call(fn, args) { const { data, error } = await this.sb.rpc(fn, args); if (error) throw new Error(error.message); return data; },
  list() { return this.call('kuji_list'); },
  state(slug) { return this.call('kuji_state', { p_slug: slug }); },
  draw(slug, n, who, code) { return this.call('kuji_draw', { p_slug: slug, p_count: n, p_who: who, p_code: code || null }); },
  reveal(slug) { return this.call('kuji_reveal', { p_slug: slug }); },
  codeInfo(code) { return this.call('kuji_code_info', { p_code: code }); },
  async order(id) {
    const r = await fetch(D.SUPABASE_URL + '/functions/v1/kuji-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order_id: id }) });
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!j.status) j = { status: 'error', message: '주문 확인 서버에 연결하지 못했어요' };
    return j;
  },
  watch(boardId, cb) {
    if (this.ch) this.sb.removeChannel(this.ch);
    this.ch = this.sb.channel('kuji-' + boardId).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'kuji_draws', filter: 'board_id=eq.' + boardId }, p => cb(p.new)).subscribe();
  },
};

// ---- 데모: data.js 판을 이 브라우저에서 섞고 뽑음 ----
const Local = {
  boards: (D.BOARDS || []).map((b, i) => {
    const prizes = []; for (const t of b.tiers || []) for (const it of t.items) prizes.push({ grade: t.g, name: it[0], img: it[3] || null, qty: +it[2] });
    return { slug: 'b' + i, title: b.title, price: b.price, total: prizes.reduce((a, p) => a + p.qty, 0), prizes };
  }),
  async deck(b) {
    const key = 'luckyslab-kujidemo-' + b.slug + '-' + b.total;
    let d = store.get(key, null);
    if (d && d.t && d.t.length === b.total) return d;
    const t = []; b.prizes.forEach((p, idx) => { for (let k = 0; k < p.qty; k++) t.push(idx); });
    for (let i = t.length - 1; i > 0; i--) { const a = new Uint32Array(1); crypto.getRandomValues(a); const j = a[0] % (i + 1); [t[i], t[j]] = [t[j], t[i]]; }
    const salt = [...crypto.getRandomValues(new Uint8Array(16))].map(x => x.toString(16).padStart(2, '0')).join('');
    d = { t, next: 0, salt, log: [] };
    d.hash = await sha256(salt + '|' + this.order(b, d));
    store.set(key, d); return d;
  },
  order(b, d) { return d.t.map((idx, i) => `${i + 1}:${b.prizes[idx].grade}:${b.prizes[idx].name}`).join('|'); },
  save(b, d) { store.set('luckyslab-kujidemo-' + b.slug + '-' + b.total, d); },
  async list() {
    const out = [];
    for (const b of this.boards) {
      const d = await this.deck(b), rest = d.t.slice(d.next).map(i => b.prizes[i].grade);
      out.push({ slug: b.slug, title: b.title, price: b.price, total: b.total, mode: 'auto', test: true, status: rest.length ? 'open' : 'closed',
        left: rest.length, hits_left: rest.filter(HIT).length, s_left: rest.filter(g => g === 'S').length, imgs: b.prizes.filter(p => p.img).slice(0, 3).map(p => p.img) });
    }
    return out;
  },
  async state(slug) {
    const b = this.boards.find(x => x.slug === slug); if (!b) return null;
    const d = await this.deck(b), left = d.t.length - d.next, rem = b.prizes.map(() => 0);
    for (let i = d.next; i < d.t.length; i++) rem[d.t[i]]++;
    return { id: slug, slug, title: b.title, price: b.price, total: b.total, mode: 'auto', test: true, status: left ? 'open' : 'closed', hash: d.hash, salt: left ? null : d.salt, left,
      prizes: b.prizes.map((p, idx) => ({ idx, ...p, left: rem[idx] })), recent: d.log.slice(0, 30) };
  },
  async draw(slug, n, who) {
    const b = this.boards.find(x => x.slug === slug), d = await this.deck(b), res = [];
    n = Math.min(n, 10, d.t.length - d.next);
    for (let i = 0; i < n; i++) { const p = b.prizes[d.t[d.next]]; res.push({ no: d.next + 1, grade: p.grade, name: p.name, img: p.img }); d.next++; }
    d.log = res.slice().reverse().map(r => ({ ...r, who })).concat(d.log).slice(0, 100); this.save(b, d);
    return { results: res, left: d.t.length - d.next, closed: d.next === d.t.length };
  },
  async reveal(slug) { const b = this.boards.find(x => x.slug === slug), d = await this.deck(b); return { salt: d.salt, hash: d.hash, order: this.order(b, d) }; },
  async codeInfo() { return null; },
  watch() {},
};

let API = Local, LIVE = false;

/* ====================== 화면 ====================== */
const V = $('#view');
let cur = null, qty = 1, code = (QS.get('code') || store.get('luckyslab-kuji-code', '') || '').toUpperCase(), codeLeft = null;

const productUrl = no => (D.SHOP_URL || '').replace(/\/?$/, '/') + 'product/detail.html?product_no=' + no;
function syncBuy() {
  const s = st, go = $('#go'), buy = $('#buy'), link = $('#buyLink'), qtyBox = $('#qty');
  if (!s) { buy.classList.add('hidden'); return; }
  buy.classList.remove('hidden');
  const realPay = LIVE && !s.test && s.mode === 'auto' && s.status === 'open' && s.left > 0 && !code;
  link.classList.toggle('hidden', !realPay); go.classList.toggle('hidden', realPay); qtyBox.classList.toggle('hidden', realPay);
  if (realPay) {
    if (s.product_no && D.SHOP_URL) { link.href = productUrl(s.product_no); link.textContent = `결제하고 바로 뽑기 · 1회 ${won(s.price)} →`; link.style.pointerEvents = ''; link.style.opacity = ''; }
    else { link.removeAttribute('href'); link.textContent = '판매 준비 중이에요'; link.style.pointerEvents = 'none'; link.style.opacity = '.5'; }
    return;
  }
  const n = Math.min(qty, s.left);
  let txt, dis = false;
  if (s.status === 'closed' || s.left === 0) { txt = '마감된 판이에요'; dis = true; }
  else if (s.mode === 'live') { txt = '🔴 라이브 방송에서 개봉해요'; dis = true; }
  else if (!LIVE || s.test) txt = `${n}회 뽑기` + (LIVE ? ' · 테스트(무료)' : ` · ${won(s.price * n)}`);
  else if (!code) { txt = '뽑기 코드를 넣어주세요'; dis = true; }
  else if (codeLeft === 0) { txt = '이 코드는 다 썼어요'; dis = true; }
  else txt = `${codeLeft != null ? Math.min(n, codeLeft) : n}회 뽑기 · 코드 사용`;
  go.textContent = txt; go.disabled = dis || busy;
}
for (const bt of document.querySelectorAll('#qty button')) bt.onclick = () => {
  qty = +bt.dataset.n; for (const x of document.querySelectorAll('#qty button')) x.classList.toggle('on', x === bt); syncBuy();
};
async function checkCode() {
  codeLeft = null; if (!code || !LIVE) return null;
  try { const r = await API.codeInfo(code); if (r) { codeLeft = r.left; return r; } toast('없는 코드예요. 다시 확인해주세요'); } catch (e) { toast(e.message); }

/* ---------- 뽑기 ---------- */
let busy = false, myBatch = new Set();
$('#go').onclick = async () => {
  if (!st || busy) return; busy = true; syncBuy();
  const s = st;
  try {
    const r = await API.draw(s.slug, qty, (myName || '').trim() || '익명', code);
    if (r.batch) myBatch.add(r.batch);
    if (r.code_left != null) codeLeft = r.code_left;
    if (!r.results.length) { toast('남은 표가 없어요'); busy = false; return showBoard(s.slug, true); }
    showResult(r.results, () => { busy = false; showBoard(s.slug, true); });
  } catch (e) { busy = false; syncBuy(); toast(e.message); }
};
function showResult(got, done) {
  const G = $('#ovG'); G.textContent = '';
  $('#ovT').textContent = '두근두근…'; $('#ovS').textContent = '카드를 눌러서 열어보세요';
  $('#ovA').classList.add('hidden'); $('#ov').classList.remove('hidden');
  let opened = 0;
  const cards = got.map(t => {
    const c = el('div', 'tk wait' + (HIT(t.grade) ? ' big' : '')), inn = el('div', 'in'), f = el('div', 'f', '?'), bk = el('div', 'b'), g = el('span', 'g', GN(t.grade));
    g.style.background = COL(t.grade);
    if (t.img) { const im = el('img'); im.src = imgUrl(t.img); im.alt = ''; bk.classList.add('ph'); bk.append(im, g, el('small', '', t.name.replace(' PSA10', ''))); }
    else bk.append(g, el('small', '', t.name));
    inn.append(f, bk); c.appendChild(inn); c.onclick = () => open(c, t); G.appendChild(c); return [c, t];
  });
  function open(c, t) {
    if (c.classList.contains('open')) return;
    c.classList.remove('wait'); c.classList.add('open'); if (HIT(t.grade)) { c.classList.add('hit'); setTimeout(() => burst(t.grade === 'S' ? 180 : 90), 250); }
    if (++opened === cards.length) {
      const hits = got.filter(x => HIT(x.grade));
      $('#ovT').textContent = hits.length ? `🎉 ${hits.map(x => GN(x.grade)).join(', ')} 당첨!` : '아쉽지만 포인트상';
      $('#ovS').textContent = hits.length ? (LIVE ? '광장 전체에 폭죽이 터지고 명예의 전당에 올라가요' : '실제 운영에선 광장에 폭죽이 터지고 명예의 전당에 올라가요') : (LIVE ? '포인트는 상점에서 쓸 수 있어요' : '포인트는 다음 뽑기나 상점에서 쓸 수 있어요 (데모)');
    }
  }
  setTimeout(() => $('#ovA').classList.remove('hidden'), 400);
  $('#ovAll').onclick = () => cards.forEach(([c, t], i) => setTimeout(() => open(c, t), i * 120));
  $('#ovOk').onclick = () => {
    cards.forEach(([c, t]) => open(c, t)); $('#ov').classList.add('hidden');
    tellPlaza(LIVE ? { type: 'kuji-refresh' } : { type: 'kuji', got: got.map(t => ({ g: t.grade, n: t.name })) });
    done();
  };
}
// 다른 사람이 뽑으면 실시간 반영
let refreshT = 0;
function onRemoteDraw(d) {
  if (myBatch.has(d.batch)) return;
  if (HIT(d.grade)) toast(`🎉 ${d.who}님 ${GN(d.grade)} ${d.name} 당첨!`);
  clearTimeout(refreshT); refreshT = setTimeout(() => { if (cur && !busy) showBoard(cur, true); }, 600);
}

/* ---------- 카페24 결제 후 도착: 주문 확인 → 바로 카드 공개 ---------- */
async function landOrder(id, tries = 0) {
  V.textContent = '';
  const w = el('div', 'wait'); w.append(el('h3', '', '🎰 결제 확인 중…'), el('p', '', '주문 ' + id)); V.appendChild(w);
  const r = await Server.order(id);
  if (r.status === 'ok') {
    const all = [], boards = r.boards || [];
    for (const b of boards) for (const x of b.results || []) all.push(x);
    const prev = myOrders().filter(o => o.id !== id);
    store.set('luckyslab-kuji-orders', [{ id, n: all.length, hits: all.filter(x => HIT(x.grade)).length }, ...prev].slice(0, 20));
    const short = boards.reduce((a, b) => a + (b.shortage || 0), 0), pending = boards.filter(b => b.pending);
    const goBoard = () => { history.replaceState(null, '', location.pathname + (EMBED ? '?embed=1' : '') + (boards[0] ? '#/' + boards[0].slug : '')); route(); };
    if (!all.length) {
      w.textContent = '';
      w.append(el('h3', '', pending.length ? '🔴 라이브 판 주문이에요' : '결과가 없어요'),
        el('p', '', pending.length ? '방송에서 개봉해드려요. 결과는 방송이 끝나면 이 링크에서 다시 볼 수 있어요.' : short ? `표가 모자라서 ${short}회분은 뽑지 못했어요. 환불해드릴게요.` : '이 주문엔 뽑을 쿠지가 없어요.'));
      const b = el('button', 'pill', '판 보러 가기'); b.onclick = goBoard; w.appendChild(b); return;
    }
    if (short) toast(`표가 모자라서 ${short}회분은 뽑지 못했어요. 그만큼 환불해드릴게요`);
    myName = r.who || myName;
    showResult(all, goBoard);
    return;
  }
  w.textContent = '';
  const msgs = { unpaid: ['💳 입금 확인 전이에요', r.message], canceled: ['취소된 주문이에요', ''], none: ['쿠지 상품이 없는 주문이에요', '일반 상품 주문은 상점에서 확인해주세요.'],
    not_found: ['주문을 찾을 수 없어요', '주문번호를 다시 확인해주세요.'], bad_order: ['주문번호가 이상해요', ''] };
  const [t, m] = msgs[r.status] || ['잠시 문제가 생겼어요', r.message || '조금 뒤에 다시 열어주세요.'];
  w.append(el('h3', '', t), el('p', '', m || ''));
  if (r.status === 'unpaid' || r.status === 'error') { const b = el('button', 'pill', '다시 확인'); b.onclick = () => landOrder(id, tries + 1); w.appendChild(b); }
  if (r.status === 'error' && tries < 2) setTimeout(() => landOrder(id, tries + 1), 2500);
}

/* ---------- 폭죽 ---------- */
const fx = $('#fx'), cx = fx.getContext('2d'); let parts = [], raf = 0;
function size() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener('resize', size); size();
function burst(n) {
  const cols = ['#ffe08a', '#e2453c', '#3a7cf0', '#2fa860', '#ff7ad8', '#fff'];
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2, y: innerHeight * .4, vx: (Math.random() - .5) * 600, vy: -250 - Math.random() * 420, r: Math.random() * 6, vr: (Math.random() - .5) * 12, c: cols[i % 6], l: 2 + Math.random() });
  if (!raf) { let last = performance.now(); const step = t => { const dt = Math.min(.05, (t - last) / 1000); last = t;
    cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) { p.vy += 640 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.l -= dt;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.max(0, Math.min(1, p.l)); cx.fillStyle = p.c; cx.fillRect(-4, -2, 8, 4); cx.restore(); }
    parts = parts.filter(p => p.l > 0 && p.y < innerHeight + 40);
    if (parts.length) raf = requestAnimationFrame(step); else { raf = 0; cx.clearRect(0, 0, innerWidth, innerHeight); } };
    raf = requestAnimationFrame(step); }
}

  API = LIVE ? Server : Local;
  const bar = $('#modeBar');
  if (LIVE) { bar.classList.add('live'); bar.textContent = '● 실시간 서버 연결됨 · 모든 손님이 같은 판을 함께 뽑아요'; }
  else bar.textContent = '🧪 데모 화면 · 실제 결제·배송 없음 · 이 브라우저에서만 저장돼요';
  const orderId = (QS.get('order') || '').trim();
  if (LIVE && orderId) return landOrder(orderId);
  if (LIVE && code) { const r = await checkCode(); if (r && !location.hash) { location.hash = '#/' + r.slug; return; } }
  route();
})();
})();
</script>
